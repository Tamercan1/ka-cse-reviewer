[build]
  # The command Netlify will run to compile your Vite/TypeScript code
  command = "npm run build"
  
  # The folder Netlify will serve to the public (generated by Vite)
  publish = "dist"

# Production caching & performance headers for Core Web Vitals
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

